<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Trái Cây - Ghi Chú Giá</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main class="container">
        <h1>Ghi chú giá trái cây</h1>
        <section class="add-note">
            <input type="text" id="fruitName" placeholder="Tên trái cây" />
            <input type="number" id="fruitPrice" placeholder="Giá (VND)" min="0" />
            <button id="addBtn">Thêm</button>
        </section>
        <section class="notes-list" id="notesList">
            <!-- Fruit notes will be rendered here -->
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
